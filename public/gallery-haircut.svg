<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="hairBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF6F2" />
      <stop offset="60%" stop-color="#F7ECE5" />
      <stop offset="100%" stop-color="#ECD7CC" />
    </linearGradient>
    <linearGradient id="woodSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DFCEBE" />
      <stop offset="100%" stop-color="#C5B19E" />
    </linearGradient>
    <linearGradient id="steelBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E6E9" />
      <stop offset="80%" stop-color="#B8C0C6" />
      <stop offset="100%" stop-color="#8E99A2" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBE69F" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9C7709" />
    </linearGradient>
    <filter id="shadowH" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#553A33" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Background Wall -->
  <rect width="800" height="420" fill="url(#hairBg)" />

  <!-- Soft Ambient Glow -->
  <circle cx="400" cy="220" r="260" fill="#FFF9F5" opacity="0.7" />

  <!-- Wooden Surface Table -->
  <rect y="420" width="800" height="180" fill="url(#woodSurface)" />
  <line x1="0" y1="420" x2="800" y2="420" stroke="#B09C88" stroke-width="2" />

  <!-- Salon Styling Cape Folded in Background (Left) -->
  <g filter="url(#shadowH)">
    <path d="M 80 290 Q 180 270 280 290 L 290 425 L 70 425 Z" fill="#9F2B48" opacity="0.9" />
    <path d="M 100 320 Q 180 300 260 320" stroke="#7E1E34" stroke-width="4" fill="none" />
    <path d="M 120 360 Q 180 340 240 360" stroke="#7E1E34" stroke-width="4" fill="none" />
    <!-- Gold Trim on cape -->
    <path d="M 80 290 Q 180 270 280 290" stroke="url(#goldAccent)" stroke-width="4" fill="none" />
  </g>

  <!-- Professional Hairdressing Scissors (Center Left to Center Right) -->
  <g filter="url(#shadowH)">
    <!-- Shadow for scissors -->
    <ellipse cx="440" cy="380" rx="140" ry="15" fill="#A89482" opacity="0.4" />

    <!-- Left Scissor Blade -->
    <path d="M 330 420 L 490 280 L 530 245 L 515 240 L 460 275 L 315 410 Z" fill="url(#steelBlade)" stroke="#B8C0C6" stroke-width="1.5" />
    <!-- Left Scissor Finger Loop -->
    <ellipse cx="295" cy="435" rx="24" ry="20" fill="none" stroke="url(#steelBlade)" stroke-width="10" />

    <!-- Right Scissor Blade -->
    <path d="M 315 365 L 460 305 L 535 240 L 520 235 L 440 295 L 300 350 Z" fill="url(#steelBlade)" stroke="#B8C0C6" stroke-width="1.5" />
    <!-- Right Scissor Thumb Loop -->
    <ellipse cx="280" cy="340" rx="22" ry="18" fill="none" stroke="url(#steelBlade)" stroke-width="10" />

    <!-- Pivot Screw (Gold) -->
    <circle cx="455" cy="295" r="9" fill="url(#goldAccent)" stroke="#755604" stroke-width="1.5" />
    <circle cx="455" cy="295" r="4" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- Professional Styling Comb (Center Right) -->
  <g filter="url(#shadowH)">
    <rect x="420" y="380" width="220" height="26" rx="4" transform="rotate(-12 420 380)" fill="#231F20" />
    <!-- Fine Teeth -->
    <path d="M 450 380 L 450 420 M 458 378 L 458 418 M 466 376 L 466 416 M 474 374 L 474 414 M 482 372 L 482 412 M 490 370 L 490 410 M 498 368 L 498 408 M 506 366 L 506 406 M 514 364 L 514 404 M 522 362 L 522 402 M 530 360 L 530 400 M 538 358 L 538 398 M 546 356 L 546 396 M 554 354 L 554 394 M 562 352 L 562 392 M 570 350 L 570 390 M 578 348 L 578 388 M 586 346 L 586 386 M 594 344 L 594 384 M 602 342 L 602 382" stroke="#231F20" stroke-width="3" stroke-linecap="round" />
    <!-- Wide Teeth Section -->
    <path d="M 615 340 L 615 378 M 628 337 L 628 375 M 641 334 L 641 372" stroke="#231F20" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Sectioning Hair Clips (Right Foreground) -->
  <g filter="url(#shadowH)">
    <rect x="580" y="435" width="110" height="14" rx="7" transform="rotate(25 580 435)" fill="#9F2B48" />
    <circle cx="585" cy="437" r="5" fill="url(#goldAccent)" />
    <rect x="540" y="455" width="110" height="14" rx="7" transform="rotate(15 540 455)" fill="#D4AF37" />
    <circle cx="545" cy="457" r="5" fill="#9F2B48" />
  </g>

  <!-- Water Mist Spray Bottle (Left Foreground) -->
  <g filter="url(#shadowH)">
    <rect x="190" y="270" width="60" height="140" rx="14" fill="#FFFFFF" stroke="#E2D0C9" stroke-width="2" />
    <path d="M 190 280 L 250 280 L 235 240 L 205 240 Z" fill="#9F2B48" />
    <!-- Trigger Nozzle -->
    <rect x="210" y="220" width="18" height="22" fill="#231F20" />
    <path d="M 215 220 L 175 210 L 175 225 L 210 232 Z" fill="#231F20" />
    <path d="M 205 235 Q 185 245 190 270" stroke="#231F20" stroke-width="6" fill="none" stroke-linecap="round" />
  </g>

  <!-- Bottom Title Tag Banner -->
  <rect x="240" y="525" width="320" height="36" rx="18" fill="#9F2B48" opacity="0.95" />
  <text x="400" y="548" fill="#FFFFFF" font-family="'Playfair Display', serif, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">
    HAIRCUT &amp; STYLING SETUP
  </text>
</svg>
