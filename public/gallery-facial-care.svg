<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F5" />
      <stop offset="50%" stop-color="#F7EBE8" />
      <stop offset="100%" stop-color="#EEDDD8" />
    </linearGradient>
    <linearGradient id="marbleCounter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAE2DE" />
      <stop offset="100%" stop-color="#D9CECA" />
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E09E" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>
    <linearGradient id="glassBowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E2D0C9" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="roseWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7CAD0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EE9CA7" stop-opacity="0.9" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7A4E45" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Wall -->
  <rect width="800" height="420" fill="url(#bgGrad)" />

  <!-- Soft Ambient Glow -->
  <circle cx="400" cy="200" r="280" fill="#FFF5F2" opacity="0.6" />

  <!-- Countertop -->
  <rect y="420" width="800" height="180" fill="url(#marbleCounter)" />
  <line x1="0" y1="420" x2="800" y2="420" stroke="#C5B5B0" stroke-width="2" />

  <!-- Botanical branch in background -->
  <path d="M 680 430 Q 640 280 610 160" fill="none" stroke="#A8948C" stroke-width="3" stroke-linecap="round" />
  <ellipse cx="640" cy="280" rx="14" ry="24" transform="rotate(-35 640 280)" fill="#C2B0A8" opacity="0.7" />
  <ellipse cx="625" cy="230" rx="12" ry="20" transform="rotate(35 625 230)" fill="#C2B0A8" opacity="0.7" />
  <ellipse cx="612" cy="180" rx="11" ry="18" transform="rotate(-25 612 180)" fill="#C2B0A8" opacity="0.7" />

  <!-- Rolled Spa Towels (Left) -->
  <g filter="url(#softShadow)">
    <rect x="110" y="320" width="130" height="110" rx="12" fill="#FFFFFF" />
    <path d="M 110 350 Q 175 340 240 350" stroke="#EFE9E6" stroke-width="3" fill="none" />
    <path d="M 110 385 Q 175 375 240 385" stroke="#EFE9E6" stroke-width="3" fill="none" />
    <!-- Top Rolled Towel -->
    <ellipse cx="140" cy="310" rx="30" ry="42" fill="#FAF5F3" stroke="#E8DDD8" stroke-width="2" />
    <ellipse cx="140" cy="310" rx="16" ry="22" fill="#E8DDD8" />
    <path d="M 140 268 L 240 278 L 240 345 L 140 345 Z" fill="#FFFFFF" stroke="#E8DDD8" stroke-width="1.5" />
    <!-- Ribbon around towel -->
    <path d="M 190 273 L 205 274 L 205 345 L 190 345 Z" fill="#9F2B48" opacity="0.85" />
  </g>

  <!-- Skincare Glass Bowl with Floral Water (Center) -->
  <g filter="url(#softShadow)">
    <ellipse cx="400" cy="430" rx="120" ry="25" fill="#C2B2AD" opacity="0.4" />
    <path d="M 280 370 Q 280 440 400 440 Q 520 440 520 370 Z" fill="url(#glassBowl)" stroke="#FFFFFF" stroke-width="3" />
    <!-- Rosewater Level -->
    <path d="M 295 385 Q 295 430 400 430 Q 505 430 505 385 Z" fill="url(#roseWater)" />
    <!-- Floating Rose Petals -->
    <ellipse cx="360" cy="395" rx="16" ry="12" transform="rotate(15 360 395)" fill="#B53A5A" opacity="0.9" />
    <ellipse cx="440" cy="400" rx="18" ry="13" transform="rotate(-20 440 400)" fill="#C74668" opacity="0.9" />
    <ellipse cx="400" cy="410" rx="14" ry="10" transform="rotate(5 400 410)" fill="#A82846" opacity="0.9" />
    <!-- Facial Mask Applicator Fan Brush -->
    <path d="M 330 460 L 460 340" stroke="#D4AF37" stroke-width="8" stroke-linecap="round" />
    <path d="M 450 350 L 490 315 L 480 305 L 440 340 Z" fill="#FAF7F5" stroke="#D4AF37" stroke-width="2" />
  </g>

  <!-- Cosmetic Skincare Jars with Gold Lids (Right) -->
  <g filter="url(#softShadow)">
    <!-- Small Jar -->
    <rect x="540" y="380" width="80" height="55" rx="8" fill="#FFFFFF" stroke="#EAE2DE" stroke-width="2" />
    <rect x="536" y="365" width="88" height="18" rx="4" fill="url(#goldCap)" />
    <!-- Label -->
    <rect x="550" y="392" width="60" height="28" rx="4" fill="#FDF8F5" />
    <line x1="558" y1="402" x2="602" y2="402" stroke="#9F2B48" stroke-width="2" />
    <line x1="562" y1="410" x2="598" y2="410" stroke="#CBB4AD" stroke-width="1.5" />

    <!-- Tall Serum Bottle with Pipette -->
    <rect x="635" y="340" width="55" height="95" rx="10" fill="#FFFFFF" stroke="#EAE2DE" stroke-width="2" />
    <rect x="645" y="325" width="35" height="18" rx="4" fill="url(#goldCap)" />
    <rect x="652" y="305" width="21" height="22" rx="6" fill="#FFFFFF" stroke="#EAE2DE" stroke-width="1.5" />
    <!-- Serum Label -->
    <rect x="643" y="355" width="39" height="55" rx="4" fill="#FDF8F5" />
    <line x1="648" y1="372" x2="677" y2="372" stroke="#9F2B48" stroke-width="2" />
    <line x1="650" y1="382" x2="675" y2="382" stroke="#CBB4AD" stroke-width="1.5" />
  </g>

  <!-- Jasmine / Pink Blossom Accent in Front -->
  <circle cx="270" cy="460" r="10" fill="#FFFFFF" />
  <circle cx="282" cy="455" r="9" fill="#FFFFFF" />
  <circle cx="265" cy="472" r="9" fill="#FFFFFF" />
  <circle cx="272" cy="462" r="5" fill="#FFDA73" />

  <!-- Bottom Title Tag Banner -->
  <rect x="250" y="525" width="300" height="36" rx="18" fill="#9F2B48" opacity="0.95" />
  <text x="400" y="548" fill="#FFFFFF" font-family="'Playfair Display', serif, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">
    FACIAL CARE SETUP
  </text>
</svg>
